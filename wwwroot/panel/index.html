<script>
  (function () {
    var root = document.documentElement;
    try {
      var theme = localStorage.getItem('pb.theme') || 'auto';
      var dark = theme === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark';
      root.dataset.theme = dark ? 'dark' : 'light';
      if (localStorage.getItem('pb.motion') === 'calm') root.classList.add('calm');
    } catch (e) {
      root.dataset.theme = 'dark';
    }
  })();
</script>
