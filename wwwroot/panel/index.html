<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-text"><b>PODERE<span>BOT</span></b><small>Pannello di controllo</small></div>
    </div>

    <nav class="rail-nav" aria-label="Sezioni">
      <button class="nav-item active" data-view="home"><svg class="icon"><use href="#i-home"></use></svg><span>Casa</span></button>
      <button class="nav-item" data-view="heating"><svg class="icon"><use href="#i-heat"></use></svg><span>Riscaldamento</span></button>
      <button class="nav-item" data-view="gates"><svg class="icon"><use href="#i-gate"></use></svg><span>Cancelli</span></button>
      <button class="nav-item" data-view="events"><svg class="icon"><use href="#i-bell"></use></svg><span>Eventi</span></button>
      <button class="nav-item" data-view="system"><svg class="icon"><use href="#i-gear"></use></svg><span>Sistema</span></button>
      <button class="nav-item" data-view="users"><svg class="icon"><use href="#i-users"></use></svg><span>Utenti</span></button>
      <button class="nav-item" data-view="devices"><svg class="icon"><use href="#i-device"></use></svg><span>Dispositivi</span></button>
    </nav>

    <div class="rail-foot">
      <span class="rail-meta" id="rail-mode">Locale</span>
      <span class="rail-meta" id="rail-version">v—</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="titles">
        <h1 id="page-title">Casa</h1>
        <p id="page-sub">Tutto sotto controllo</p>
      </div>
      <div class="top-right">
        <div class="clock" aria-label="Ora locale">
          <b id="clock">--:--</b>
          <span id="clock-date">lun 2 nov</span>
        </div>
        <div class="top-status">
          <button class="pill alert" id="alert-pill" data-action="alerts" aria-label="Avvisi attivi" hidden>
            <svg class="icon"><use href="#i-alert"></use></svg>
            <span id="alert-count">1 avviso</span>
          </button>
          <span class="pill" id="tg-pill" title="Telegram connesso"><span class="dot"></span><span class="label">Telegram</span></span>
          <span class="pill" id="db-pill" title="Database scrivibile"><span class="dot"></span><span class="label">Database</span></span>
          <span class="pill" id="cpu-pill" title="Temperatura CPU"><svg class="icon"><use href="#i-cpu"></use></svg><span id="cpu-value">—</span></span>
          <button class="pill ghost" id="logout-pill" data-action="logout" hidden title="Esci da questo dispositivo"><svg class="icon"><use href="#i-lock"></use></svg><span class="label">Esci</span></button>
        </div>
      </div>
    </header>

    <main class="views">
      <section class="view active" data-view="home"><div id="home-view"></div></section>
      <section class="view" data-view="heating"><div id="heating-view"></div></section>
      <section class="view" data-view="gates"><div id="gates-view"></div></section>
      <section class="view" data-view="events"><div id="events-view"></div></section>
      <section class="view" data-view="system"><div id="system-view"></div></section>
      <section class="view" data-view="users"><div id="users-view"></div></section>
      <section class="view" data-view="devices"><div id="devices-view"></div></section>
    </main>
  </div>

  <nav class="tabs" aria-label="Sezioni">
    <button class="active" data-view="home"><svg class="icon"><use href="#i-home"></use></svg><span>Casa</span></button>
    <button data-view="heating"><svg class="icon"><use href="#i-heat"></use></svg><span>Caldaia</span></button>
    <button data-view="gates"><svg class="icon"><use href="#i-gate"></use></svg><span>Cancelli</span></button>
    <button data-view="events"><svg class="icon"><use href="#i-bell"></use></svg><span>Eventi</span></button>
    <button data-more="1"><svg class="icon"><use href="#i-more"></use></svg><span>Altro</span></button>
  </nav>
</div>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="sheet-title"></h2>
  <p id="sheet-body"></p>
  <div id="sheet-content"></div>
  <div class="sheet-actions" id="sheet-actions"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="app.js?v=15"></script>
</body>
</html>
