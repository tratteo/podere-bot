<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0b">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>PodereBot · Accesso</title>
<script>
  (function () {
    try {
      var theme = localStorage.getItem('pb.theme') || 'auto';
      var dark = theme === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body class="gate-page">
  <div class="gate-wrap">
    <div class="aura show" aria-hidden="true"><i class="aura-drift"><i class="aura-morph"><b class="aura-core" style="color:rgb(224,163,67)"></b><b class="aura-hl" style="color:rgb(228,140,70)"></b></i></i></div>
    <main class="gate-card">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>PodereBot</h1>
      <p class="gate-sub">Questo pannello si apre solo dai dispositivi autorizzati.</p>

      <form id="pair-form" class="gate-form" novalidate>
        <label class="field">
          <span>Codice di pairing</span>
          <input id="token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Incolla il codice del link">
        </label>
        <p class="form-error" id="error"></p>
        <button class="btn p" type="submit" id="submit">Autorizza questo dispositivo</button>
      </form>

      <div class="gate-help">
        <p>Il codice si genera dal pannello in <b>Dispositivi</b>, oppure dal Raspberry con:</p>
        <code>./panel-pair.sh "nome dispositivo"</code>
        <p>Vale una sola volta e scade dopo pochi minuti.</p>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('pair-form');
    const tokenInput = document.getElementById('token');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');

    const params = new URLSearchParams(location.search);
    if (params.get('token')) tokenInput.value = params.get('token');

    fetch('/panel/api/whoami', { credentials: 'same-origin', cache: 'no-store' })
      .then((r) => r.json())
      .then((data) => {
        if (data.authenticated) location.replace('/panel/');
      })
      .catch(() => {});

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      // The code may be pasted with the whole link around it: keep only the token.
      let token = tokenInput.value.trim();
      const match = token.match(/[?&]token=([^&\s]+)/);
      if (match) token = decodeURIComponent(match[1]);
      if (!token) {
        error.textContent = 'Incolla il codice di pairing.';
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Verifico…';
      try {
        const response = await fetch('/panel/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token }),
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error(data?.error || 'Pairing non riuscito.');
        location.replace('/panel/');
      } catch (e) {
        error.textContent = e.message;
        submit.disabled = false;
        submit.textContent = 'Autorizza questo dispositivo';
      }
    });
  </script>
</body>
</html>
