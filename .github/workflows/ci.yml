name: CI

on:
  push:
    # Every push except the promotion branch itself, which would only re-verify a commit
    # that already passed on main.
    branches-ignore: [release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PodereBot.csproj

      - name: Build (Release)
        run: dotnet build PodereBot.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/poderebot.tests/PodereBot.Tests.csproj -c Release

  promote-release:
    name: Fast-forward release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release is only ever moved forward, and only to a commit whose build and tests passed.
      # Pushing to release does not re-trigger this workflow: it runs on main and pull requests only.
      - name: Fast-forward release to the verified commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/release:refs/remotes/origin/release' || true
          if git rev-parse --verify --quiet refs/remotes/origin/release >/dev/null; then
            if ! git merge-base --is-ancestor refs/remotes/origin/release HEAD; then
              echo "::error::release contains commits that are not in main; refusing to move it"
              exit 1
            fi
            if [ "$(git rev-parse refs/remotes/origin/release)" = "$(git rev-parse HEAD)" ]; then
              echo "release is already at $HEAD"
              exit 0
            fi
          fi
          git push origin "HEAD:refs/heads/release"
